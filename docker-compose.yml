services:
    webserver:
        image: 'nginx:alpine'
        working_dir: /app
        volumes:
            - '.:/app'
            - './docker/phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '30001:80'

    php-fpm:
        build: docker/phpdocker/php-fpm
        working_dir: /app
        volumes:
            - '.:/app'
            - './docker/phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/fpm/conf.d/99-overrides.ini'
            - './docker/phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/cli/conf.d/99-overrides.ini'
        environment:
            PHP_IDE_CONFIG: "serverName=Docker"

    php:
        build: docker
        working_dir: /app
        volumes:
            - '.:/app'
            - './docker/Caddyfile:/etc/frankenphp/Caddyfile'
            - './docker/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini'
        environment:
            PHP_IDE_CONFIG: "serverName=Docker"
        ports:
            - '30000:80'
